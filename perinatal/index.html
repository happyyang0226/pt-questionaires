<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산전·산후 환자 설문도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f1; --card:#ffffff; --ink:#24262b; --muted:#6b6f78; --line:#e4e0da;
  --accent:#2f6f6a; --accent-soft:#e3efed; --accent-ink:#1f4f4b;
  --ok:#2e7d4f; --ok-soft:#e5f3ea; --warn:#a86a10; --warn-soft:#fbf0dc; --bad:#b3372f; --bad-soft:#fbe6e3;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.brand{font-weight:700;font-size:17px;letter-spacing:-.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.pt{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pt label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.pt input,.pt select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.pt input.w-s{width:90px}.pt input.w-m{width:130px}
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px}
nav.side{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:6px}
.nav-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 12px;cursor:pointer}
.nav-btn:hover{background:#ece8e2}
.nav-btn.active{background:var(--card);border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.nav-btn b{font-weight:700;font-size:14px}
.nav-btn span.sub{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#ece8e2;color:var(--muted);white-space:nowrap}
.badge.done{background:var(--accent-soft);color:var(--accent-ink)}
.nav-sep{height:1px;background:var(--line);margin:6px 4px}
main{min-width:0}
.panel-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.panel-head h1{margin:0 0 2px;font-size:20px;letter-spacing:-.3px}
.panel-head .full{color:var(--muted);font-size:13px}
.panel-head p.desc{margin:10px 0 0;font-size:14px}
.instr{margin-top:10px;padding:10px 12px;background:var(--accent-soft);border-radius:8px;font-size:14px;color:var(--accent-ink)}
.result{border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
.result .r-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.result .big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.result .lbl{font-size:12px;color:var(--muted)}
.result .interp{font-weight:700;padding:3px 10px;border-radius:999px;font-size:13px}
.lv-ok .interp{background:var(--ok-soft);color:var(--ok)}
.lv-warn .interp{background:var(--warn-soft);color:var(--warn)}
.lv-bad .interp{background:var(--bad-soft);color:var(--bad)}
.lv-none .interp{background:#ece8e2;color:var(--muted)}
.result .lines{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13.5px}
.result .lines span b{font-weight:700}
.alert{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:500;font-size:14px;border-left:4px solid var(--bad)}
.note{margin-top:8px;font-size:12.5px;color:var(--muted)}
.bars{margin-top:10px;display:grid;grid-template-columns:150px 1fr 44px;gap:6px 10px;align-items:center;font-size:13px}
.bar{height:10px;background:#ece8e2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.sec{margin:18px 0 8px;font-weight:700;font-size:14.5px;color:var(--accent-ink);padding-left:4px;border-left:3px solid var(--accent);padding-left:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:8px;transition:border-color .15s}
.item.answered{border-color:#cfe1de}
.item .q{display:flex;gap:10px;font-size:14.5px;font-weight:500}
.item .q .n{color:var(--muted);font-weight:700;min-width:26px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-left:36px}
.opt{border:1px solid var(--line);background:#fbfaf8;border-radius:8px;padding:6px 11px;font-size:13.5px;cursor:pointer;text-align:left;line-height:1.35}
.opt:hover{border-color:#b9ccc9;background:#f3f8f7}
.opt.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.na{border-style:dashed}
.opt.sel.na{background:#6b6f78;border-color:#6b6f78}
.opts.scale .opt{min-width:38px;text-align:center}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding-left:36px;margin-top:4px;max-width:520px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 30px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{background:#f1eee9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--bad)}
table.sum{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:14px}
table.sum th,table.sum td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.sum th{background:#f1eee9;font-size:12.5px;color:var(--muted);font-weight:700}
table.sum td.sc{font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-weight:700;padding:2px 9px;border-radius:999px;font-size:12.5px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.none{background:#ece8e2;color:var(--muted)}
textarea.copy{width:100%;min-height:200px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;background:#fff}
.ref{font-size:12px;color:var(--muted);margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:60}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:380px;width:90%}
.modal p{margin:0 0 14px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.explain{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.explain h3{margin:0 0 6px;font-size:14.5px;color:var(--accent-ink)}
.explain .lead{font-weight:500;margin:0 0 8px}
.explain h4{margin:10px 0 4px;font-size:13.5px}
.explain ul{margin:0;padding-left:20px;font-size:14px}
.explain li{margin:2px 0}
.explain p{margin:0 0 6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.chip.b{background:var(--bad-soft);color:var(--bad)}
.rmodal-bg{position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;align-items:flex-start;justify-content:center;z-index:70;overflow-y:auto;padding:40px 12px}
.rmodal-bg.show{display:flex}
.rmodal{background:#fff;border-radius:14px;max-width:680px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2);overflow:hidden}
.rmodal .rm-head{background:var(--accent);color:#fff;padding:14px 20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.rmodal .rm-head button{background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.rmodal .rm-body{padding:16px 20px}
.rmodal .rm-body .result{border:0;padding:0;margin:0}
.rmodal .rm-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:#faf9f7}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;padding:12px}
  nav.side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav-btn{flex:0 0 auto}
  .nav-btn span.sub{display:none}
  .nav-sep{display:none}
  .opts{padding-left:0}
  .scale-ends{padding-left:0}
  header.top{position:static}
  .bars{grid-template-columns:110px 1fr 40px}
}
@media print{
  header.top,nav.side,.toolbar{display:none}
  .layout{display:block;padding:0}
  body{background:#fff}
}
.rx{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.rx h3{margin:0 0 6px;font-size:14.5px;color:var(--accent-ink)}
.rx ul{margin:6px 0 0;padding-left:20px;font-size:14px}.rx li{margin:2px 0}
.stage{display:inline-block;padding:5px 12px;border-radius:8px;font-size:13.5px}
.st-h{background:var(--bad-soft);color:var(--bad)}.st-m{background:var(--warn-soft);color:#7a4c08}.st-l{background:var(--ok-soft);color:var(--ok)}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:6px}
.ex{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfbf9;font-size:13.5px}
.ex .exfig{display:block;width:100%;max-width:220px;height:auto;margin:0 auto 6px;background:#fff;border-radius:8px;border:1px solid #efebe5}
.ex-h{display:flex;align-items:center;gap:8px;font-size:14.5px}
.ex-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;flex:0 0 auto}
.ex-t{color:var(--muted);font-size:12.5px;margin-top:3px}
.ex p{margin:6px 0}
.ex-d{font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:4px 8px;display:inline-block}
.ex-c{margin-top:6px;color:#7a4c08;font-size:12.5px}
.g-b{stroke:#2b2e33;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.g-h{fill:#fff;stroke:#2b2e33;stroke-width:2.5}
.g-t{stroke:#a59e94;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.g-r{fill:#e6e0d7}
.g-o{fill:#d2a35c}
.g-a{stroke:#c0533a;stroke-width:2.2;fill:none;stroke-linecap:round;marker-end:url(#ah)}
.g-e{stroke:#c0533a;stroke-width:2;fill:none;stroke-dasharray:3 2}
.ho-bg{position:fixed;inset:0;background:rgba(20,24,28,.5);display:none;align-items:flex-start;justify-content:center;z-index:80;overflow-y:auto;padding:24px 10px}
.ho-bg.show{display:flex}
.ho{background:#fff;border-radius:14px;max-width:820px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden}
.ho-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;background:var(--accent);color:#fff;position:sticky;top:0}
.ho-bar span{display:flex;gap:6px}
.ho-bar .btn{padding:6px 12px;font-size:13.5px;background:#fff;color:var(--ink);border-color:#fff}
.ho-body{padding:22px 26px;font-size:16px;line-height:1.65}
.ho-title{font-size:26px;font-weight:700;letter-spacing:-.5px}
.ho-meta{color:var(--muted);font-size:14px;margin:2px 0 14px}
.ho-body section{margin:18px 0}
.ho-body h2{font-size:18px;margin:0 0 8px;padding-bottom:4px;border-bottom:2px solid var(--accent-soft);color:var(--accent-ink)}
.ho-body ul{margin:0;padding-left:22px}
.ho-list{display:flex;flex-direction:column;gap:12px}
.ex-big{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;font-size:15.5px;padding:14px}
.ex-big .exfig{max-width:200px;margin:0}
.ex-big .ex-h{font-size:17px}
.ex-big .ex-d{font-size:15px}
.ho-stop{background:var(--bad-soft);border-radius:10px;padding:12px 16px}
.ho-stop h2{border-color:#f0c9c4;color:var(--bad)}
.ho-log{width:100%;border-collapse:collapse;font-size:14px}
.ho-log th,.ho-log td{border:1px solid var(--line);padding:7px 6px;text-align:center}
.ho-log td:first-child{text-align:left;width:40%}
.ho-sign{margin-top:16px;color:var(--muted);font-size:14px}
.ho-foot{padding:10px 18px;border-top:1px solid var(--line);background:#faf9f7;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.ex-big{grid-template-columns:1fr}.ex-big .exfig{margin:0 auto}.ho-body{padding:16px}}

</style>

</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">산전·산후 환자 설문도구<small>PGQ · ODI · ICIQ-UI SF · EPDS · SF-12 · SF-36 · DRAM · PFIQ-7</small></div>
    <div class="pt">
      <label>이름/ID<input id="p-name" class="w-m" placeholder="홍길동"></label>
      <label>평가일<input id="p-date" type="date" class="w-m"></label>
      <label>시기<select id="p-phase"><option value="">선택</option><option>임신 중</option><option>산후</option></select></label>
      <label>임신/산후 주수<input id="p-week" class="w-s" placeholder="예: 32주"></label>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="rmodal-bg" id="rmodal"><div class="rmodal"><div class="rm-head"><span id="rm-title">결과</span><button id="rm-x" aria-label="닫기">×</button></div><div class="rm-body" id="rm-body"></div><div class="rm-foot"><button class="btn" id="rm-close">닫고 응답 검토</button><button class="btn" data-hand="cur">환자용 운동 안내문</button><button class="btn primary" id="rm-next">다음 도구로 ›</button></div></div></div>
<div class="modal-bg" id="modal"><div class="modal"><p id="modal-msg"></p><div class="row"><button class="btn" id="modal-no">취소</button><button class="btn primary" id="modal-yes">확인</button></div></div></div>

<script>
/* ============ 공통 응답 척도 ============ */
const T6 = ['항상','거의 대부분','상당 시간','가끔','조금','전혀 없음'];
const T5 = ['항상','대부분','가끔','조금','전혀 없음'];
const YN = ['예','아니오'];
const LIM = ['많이 제한됨','약간 제한됨','전혀 제한 없음'];
const INTF = ['전혀 아니다','약간','보통','꽤 많이','극심하게'];
const GH = ['최고로 좋다','매우 좋다','좋다','그저 그렇다','나쁘다'];
const TF = ['확실히 그렇다','대체로 그렇다','잘 모르겠다','대체로 아니다','전혀 아니다'];

/* ============ SF-36 (RAND 36-Item) 문항 ============ */
const SF36_ITEMS = [
 {sec:'일반 건강', q:'일반적으로 당신의 건강 상태는 어떻다고 생각합니까?', o:GH},
 {q:'1년 전과 비교했을 때 현재 당신의 건강 상태는 어떻습니까?', o:['1년 전보다 훨씬 좋다','1년 전보다 약간 좋다','1년 전과 거의 같다','1년 전보다 약간 나쁘다','1년 전보다 훨씬 나쁘다']},
 {sec:'다음은 평소 하루 동안 할 수 있는 활동입니다. 현재 건강 때문에 이 활동에 제한을 받습니까? 받는다면 어느 정도입니까?', q:'격렬한 활동(달리기, 무거운 물건 들기, 격렬한 운동 등)', o:LIM},
 {q:'중간 정도의 활동(책상 옮기기, 청소기 밀기, 볼링, 골프 등)', o:LIM},
 {q:'장바구니를 들거나 나르기', o:LIM},
 {q:'계단 여러 층 오르기', o:LIM},
 {q:'계단 한 층 오르기', o:LIM},
 {q:'몸을 굽히거나 무릎 꿇기, 웅크리기', o:LIM},
 {q:'1.6 km(1마일) 이상 걷기', o:LIM},
 {q:'수백 m 걷기(여러 블록)', o:LIM},
 {q:'약 100 m 걷기(한 블록)', o:LIM},
 {q:'혼자서 목욕하거나 옷 입기', o:LIM},
 {sec:'지난 4주 동안 신체적 건강 때문에 일이나 일상 활동에 다음과 같은 문제가 있었습니까?', q:'일이나 다른 활동에 쓰는 시간을 줄였다', o:YN},
 {q:'원하는 것보다 적게 해냈다', o:YN},
 {q:'일이나 다른 활동의 종류에 제한이 있었다', o:YN},
 {q:'일이나 다른 활동을 하는 데 어려움이 있었다(예: 더 많은 노력이 들었다)', o:YN},
 {sec:'지난 4주 동안 감정 문제(우울하거나 불안한 느낌 등) 때문에 일이나 일상 활동에 다음과 같은 문제가 있었습니까?', q:'일이나 다른 활동에 쓰는 시간을 줄였다', o:YN},
 {q:'원하는 것보다 적게 해냈다', o:YN},
 {q:'평소만큼 주의 깊게 일이나 다른 활동을 하지 못했다', o:YN},
 {sec:'사회 활동과 통증', q:'지난 4주 동안 신체적 건강이나 감정 문제가 가족, 친구, 이웃 등과의 정상적인 사회 활동을 어느 정도 방해했습니까?', o:INTF},
 {q:'지난 4주 동안 몸의 통증은 어느 정도였습니까?', o:['전혀 없었다','매우 약했다','약했다','중간 정도였다','심했다','매우 심했다']},
 {q:'지난 4주 동안 통증이 평소 일(집 안팎의 일 모두 포함)을 어느 정도 방해했습니까?', o:INTF},
 {sec:'다음은 지난 4주 동안 당신이 어떻게 느꼈는지에 대한 질문입니다. 각 문항에서 가장 가까운 것을 고르십시오.', q:'활기가 넘쳤다', o:T6},

  const ids=this.items.map(i=>i.id);
  const all=calc(ids), act=calc(ids.slice(0,20)), sym=calc(ids.slice(20));
  const na=ids.filter(id=>a[id]==='na').length;
  const answered=all.n+na, done=answered===25;
  const p=all.p;
  let interp='—',lv='none';
  if(all.n){ if(p<20){interp='경도';lv='ok';} else if(p<40){interp='중등도';lv='warn';} else {interp='중증';lv='bad';} }
  return {done, main:fmt(p), unit:'/ 100', interp, lv,
   lines:[['활동 하위척도',fmt(act.p)+' %'],['증상 하위척도',fmt(sym.p)+' %'],['원점수',all.s+' / '+(3*all.n)],['해당 없음',na+'문항']],
   note:'총점 = 원점수 ÷ (응답 문항 수 × 3) × 100. “해당 없음” 문항은 분모에서 제외합니다. 경도/중등도/중증 구분은 원저에 공식 기준이 없어 참고용으로만 표시합니다.',
   text:`PGQ ${fmt(p)}% (활동 ${fmt(act.p)}%, 증상 ${fmt(sym.p)}%)`};
 }
},
{
 id:'odi', short:'ODI', name:'오스웨스트리 장애지수', full:'Oswestry Disability Index v2.1a (Fairbank & Pynsent, 2000)',
 desc:'허리통증으로 인한 일상생활 장애를 10개 영역(각 0~5점)으로 평가합니다. 임신 관련 허리·골반 통증 평가에 널리 쓰입니다.',
 instr:'각 영역에서 오늘 당신의 상태를 가장 잘 나타내는 문장 하나를 고르십시오.',
 ref:'Fairbank JCT, Pynsent PB. Spine. 2000;25(22):2940-2953.',
 items:ODI.map(([q,o,na],i)=>({id:'q'+(i+1),q,o,na:!!na})),
 score(a){
  let s=0,n=0;this.items.forEach(i=>{const v=a[i.id];if(typeof v==='number'){s+=v;n++;}});

  return {done:n+na===10, main:fmt(p), unit:'%', interp, lv,
   lines:[['원점수',s+' / '+(5*n)],['응답 영역',n+' / 10']],
   note:'ODI(%) = 원점수 ÷ (응답 영역 수 × 5) × 100. 0–20 최소, 21–40 중등도, 41–60 중증, 61–80 심한 기능 상실, 81–100 침상 생활 수준.'+(n&&n<8?' ※ 응답 영역이 8개 미만이면 해석에 주의하십시오.':''),
   text:`ODI ${fmt(p)}% (${interp})`};
 }
},
{
 id:'iciq', short:'ICIQ-UI SF', name:'국제 요실금 설문 단축형', full:'ICIQ Urinary Incontinence Short Form (Avery et al., 2004)',
 desc:'요실금(오줌새기)의 빈도, 양, 삶의 질 영향을 평가합니다(총점 0~21). 4번 문항은 채점하지 않고 요실금 유형 파악에 씁니다.',
 instr:'지난 4주 동안 평균적으로 어땠는지 생각하여 답하십시오.',
 ref:'Avery K, Donovan J, Peters TJ, et al. Neurourol Urodyn. 2004;23(4):322-330. / 중증도: Klovning A, et al. Neurourol Urodyn. 2009;28(5):411-415.',
 items:[
  {id:'q1',q:'얼마나 자주 소변이 샙니까?',o:['전혀 새지 않는다','일주일에 한 번 이하','일주일에 두세 번','하루에 한 번 정도','하루에 여러 번','항상'],v:[0,1,2,3,4,5]},
  {id:'q2',q:'보통 얼마나 많은 양이 샌다고 생각합니까? (패드 사용 여부와 관계없이)',o:['전혀 없다','적은 양','중간 양','많은 양'],v:[0,2,4,6]},
  {id:'q3',q:'전반적으로 소변이 새는 것이 일상생활에 얼마나 방해가 됩니까?',type:'scale11',ends:['0 전혀 방해되지 않음','10 매우 많이 방해됨']},
  {id:'q4',q:'언제 소변이 샙니까? (해당하는 것을 모두 고르십시오 — 채점하지 않음)',type:'multi',o:['전혀 새지 않는다','화장실에 도착하기 전에 샌다','기침하거나 재채기할 때 샌다','잠잘 때 샌다','몸을 움직이거나 운동할 때 샌다','소변을 보고 옷을 입은 뒤에 샌다','뚜렷한 이유 없이 샌다','항상 샌다']},
 ],
 score(a){
  const q1=a.q1,q2=a.q2,q3=a.q3;
  const parts=[q1,q2,q3].filter(v=>typeof v==='number').length;
  const s=(typeof q1==='number'?this.items[0].v[q1]:0)+(typeof q2==='number'?this.items[1].v[q2]:0)+(typeof q3==='number'?q3:0);
  let interp='—',lv='none';
  if(parts===3){ if(s===0){interp='요실금 없음';lv='ok';} else if(s<=5){interp='경도';lv='ok';} else if(s<=12){interp='중등도';lv='warn';} else if(s<=18){interp='중증';lv='bad';} else {interp='최중증';lv='bad';} }
  const m=Array.isArray(a.q4)?a.q4:[];
  const stress=m.includes(2)||m.includes(4), urge=m.includes(1);
  let type='—';
  if(stress&&urge) type='혼합요실금 경향'; else if(stress) type='복압요실금 경향'; else if(urge) type='절박요실금 경향'; else if(m.length) type='기타/미분류';
  return {done:parts===3, main:parts?String(s):'–', unit:'/ 21', interp, lv,
   lines:[['빈도',typeof q1==='number'?this.items[0].v[q1]:'–'],['양',typeof q2==='number'?this.items[1].v[q2]:'–'],['삶의 질 영향',typeof q3==='number'?q3:'–'],['유형 추정(4번)',type]],
   note:'총점 = 1~3번 합(0~21). 중증도: 1–5 경도, 6–12 중등도, 13–18 중증, 19–21 최중증(Klovning 2009). 4번 문항의 유형 추정은 참고용입니다.',
   text:`ICIQ-UI SF ${parts?s:'–'}/21 (${interp}; ${type})`};
 }
},
{
 id:'epds', short:'EPDS', name:'에든버러 산후우울 척도', full:'Edinburgh Postnatal Depression Scale (Cox et al., 1987)',

 instr:'최근에 아기를 낳았거나 임신 중이시지요. 오늘만이 아니라 지난 7일 동안 느낀 것과 가장 가까운 답을 고르십시오.',

   text:`EPDS ${n?s:'–'}/30 (${interp})${q10>0?' ※10번 자해 생각 응답 있음':''}`};
 }

{
 id:'sf12', short:'SF-12', name:'단축형 건강조사 12문항', full:'SF-12 Health Survey v1 (Ware, Kosinski & Keller, 1996)',
 desc:'건강 관련 삶의 질을 신체요약점수(PCS-12)와 정신요약점수(MCS-12)로 나타냅니다. 미국 일반인구 평균 50, 표준편차 10 기준의 규준 점수입니다.',
 instr:'당신의 건강에 대한 생각을 묻는 질문입니다. 각 문항에서 가장 가까운 답 하나를 고르십시오.',
 ref:'Ware J Jr, Kosinski M, Keller SD. Med Care. 1996;34(3):220-233. ※ 공식 사용은 라이선스(QualityMetric)가 필요합니다.',
 items:SF12_ITEMS,
 score(a){
  const ids=this.items.map(i=>i.id);
  const n=ids.filter(id=>typeof a[id]==='number').length;
  let pcs=NaN,mcs=NaN;
  if(n===12){pcs=56.57706+sum(ids.map((id,k)=>SF12_PCS[k][a[id]]));mcs=60.75781+sum(ids.map((id,k)=>SF12_MCS[k][a[id]]));}
  const lvOf=x=>!Number.isFinite(x)?'none':x>=45?'ok':x>=40?'warn':'bad';
  const worst=n===12?Math.min(pcs,mcs):NaN;
  let interp='—';
  if(n===12) interp=worst>=45?'평균 범위':worst>=40?'평균보다 다소 낮음':'평균보다 낮음(1 SD 이상)';
  return {done:n===12, main:n===12?`${fmt(pcs)} / ${fmt(mcs)}`:'–', unit:'PCS / MCS', interp, lv:lvOf(worst),
   lines:[['PCS-12(신체)',fmt(pcs)],['MCS-12(정신)',fmt(mcs)],['응답',n+' / 12']],
   note:'12문항 모두 응답해야 계산됩니다. 미국 1990 규준 가중치(직교 해법)를 적용했습니다. 50 = 일반인구 평균, 10점 = 1 표준편차.',
   text:`SF-12 PCS ${fmt(pcs)}, MCS ${fmt(mcs)}`};
 }
},
{
 id:'sf36', short:'SF-36', name:'건강조사 36문항', full:'RAND 36-Item Health Survey 1.0 (SF-36 동일 문항)',
 desc:'8개 영역(신체 기능, 신체적 역할 제한, 통증, 일반 건강, 활력, 사회 기능, 감정적 역할 제한, 정서적 안녕)을 0~100점으로 나타냅니다. 점수가 높을수록 건강 상태가 좋습니다.',
 instr:'당신의 건강에 대한 생각을 묻는 질문입니다. 각 문항에서 가장 가까운 답 하나를 고르십시오.',
 ref:'Hays RD, Sherbourne CD, Mazel RM. Health Econ. 1993;2(3):217-227. (RAND 채점법)',
 items:SF36_ITEMS,
 score(a){
  const val=n=>{const v=a['q'+n];return typeof v==='number'?SF36_RECODE[n][v]:null;};
  const n=SF36_ITEMS.filter(i=>typeof a[i.id]==='number').length;
  const sc=SF36_SCALES.map(([k,label,its])=>{const vs=its.map(val).filter(v=>v!==null);return [k,label,vs.length?sum(vs)/vs.length:NaN];});
  const vals=sc.map(x=>x[2]).filter(Number.isFinite);
  const mean=vals.length?sum(vals)/vals.length:NaN;
  const low=sc.filter(x=>Number.isFinite(x[2])&&x[2]<50).map(x=>x[1]);
  let interp='—',lv='none';
  if(vals.length){ if(!low.length){interp='전 영역 50점 이상';lv='ok';} else if(low.length<=2){interp='일부 영역 저하';lv='warn';} else {interp='여러 영역 저하';lv='bad';} }
  const t2=val(2);
  return {done:n===36, main:fmt(mean), unit:'8개 영역 평균', interp, lv,
   bars:sc.map(([k,l,v])=>[`${l} (${k})`,v]),
   lines:[['응답',n+' / 36'],['건강 변화(2번)',t2===null?'–':['훨씬 좋아짐','약간 좋아짐','비슷함','약간 나빠짐','훨씬 나빠짐'][a.q2]]],
   note:'RAND 채점: 각 문항을 0~100으로 변환한 뒤 영역별로 응답한 문항의 평균을 구합니다(무응답 문항 제외). 2번(건강 변화)은 영역 점수에 들어가지 않습니다. 8개 영역 평균은 요약 참고값이며 공식 점수가 아닙니다.',
   text:'SF-36(RAND) '+sc.map(([k,l,v])=>`${k} ${fmt(v,0)}`).join(', ')};
 }
},
{
 id:'dram', short:'DRAM', name:'고통·위험 평가법', full:'Distress and Risk Assessment Method (Main et al., 1992)',
 desc:'변형 신체지각 설문지(MSPQ)와 변형 Zung 우울지수(MZDI)를 함께 써서 심리적 고통 수준을 정상 / 위험 / 고통(신체형·우울형)으로 분류합니다.',
 instr:'지난 1주 동안 어떻게 느꼈는지 가장 가까운 답을 고르십시오. 너무 오래 생각하지 말고 모든 문항에 답하십시오.',
 ref:'Main CJ, Wood PL, Hollis S, Spanswick CC, Waddell G. Spine. 1992;17(1):42-52.',
 items:[
  ...MSPQ.map(([q,s],i)=>({id:'m'+(i+1),q,o:['전혀 없음','약간','상당히','극도로(더 나쁠 수 없을 정도)'],scored:!!s,sec:i===0?'A. 신체지각(MSPQ) — 지난 1주 동안 다음을 얼마나 느꼈습니까?':undefined})),
  ...ZUNG.map(([q,r],i)=>({id:'z'+(i+1),q,o:ZUNG_O,rev:!!r,sec:i===0?'B. 기분(변형 Zung 우울지수) — 지난 1주 동안 얼마나 자주 그랬습니까?':undefined})),
 ],
 score(a){
  let ms=0,mn=0,zs=0,zn=0;
  this.items.forEach(i=>{const v=a[i.id];if(typeof v!=='number')return;
   if(i.id[0]==='m'){ if(i.scored){ms+=v;} mn++; }
   else { zs+=i.rev?3-v:v; zn++; }});
  const done=mn===22&&zn===23;
  let interp='—',lv='none';
  if(done){
   if(zs<17){interp='정상(Type N)';lv='ok';}
   else if(zs<=33&&ms<=12){interp='위험(Type R)';lv='warn';}
   else if(zs<=33){interp='고통 — 신체형(Type DS)';lv='bad';}
   else {interp='고통 — 우울형(Type DD)';lv='bad';}
  }
  const z22=typeof a.z22==='number'?a.z22:0;
  return {done, main:(mn||zn)?`${ms} / ${zs}`:'–', unit:'MSPQ / MZDI', interp, lv,
   lines:[['MSPQ(채점 13문항)',ms+' / 39'],['MZDI',zs+' / 69'],['응답',`MSPQ ${mn}/22, MZDI ${zn}/23`]],
   alerts:z22>0?['MZDI 22번(“내가 죽으면 다른 사람들이 더 나을 것 같다”)에 응답이 있습니다. 즉시 안전 평가를 하고 정신건강 전문가에게 연계하십시오. (자살예방 상담전화 109)']:[],
   note:'분류(Main 1992): MZDI <17 정상 / MZDI 17–33 & MSPQ ≤12 위험 / MZDI 17–33 & MSPQ >12 고통-신체형 / MZDI >33 고통-우울형. MSPQ 22문항 중 13문항만 채점하며 나머지는 위장 문항입니다. MZDI 2·6·7·12·14·16·18·20·21·23번은 역순 채점. ※ 체중·변비·수면·성생활 문항은 임신·산후 변화의 영향을 받을 수 있으니 해석에 주의하십시오.',
   text:`DRAM MSPQ ${ms}/39, MZDI ${zs}/69 → ${interp}${z22>0?' ※MZDI 22번 응답 있음':''}`};
 }
},
{
 id:'pfiq', short:'PFIQ-7', name:'골반바닥 영향 설문 단축형', full:'Pelvic Floor Impact Questionnaire – Short Form 7 (Barber et al., 2005)',
 desc:'방광, 장, 질·골반 증상이 일상생활과 정서에 주는 영향을 3개 하위척도(UIQ-7, CRAIQ-7, POPIQ-7)로 평가합니다. 하위척도 0~100, 총점 0~300.',
 instr:'일부 여성은 방광, 장, 질의 증상 때문에 활동이나 인간관계, 감정에 영향을 받습니다. 각 질문에서 지난 3개월 동안 각 증상이 당신에게 어느 정도 영향을 주었는지 고르십시오.',
 ref:'Barber MD, Walters MD, Bump RC. Am J Obstet Gynecol. 2005;193(1):103-113.',
 items:PFIQ_S.flatMap(([k,code,label])=>PFIQ_Q.map((q,i)=>({id:k+(i+1),q,o:['전혀 아니다','약간','보통','상당히'],sec:i===0?`${code} — ${label}이 다음에 보통 얼마나 영향을 줍니까?`:undefined}))),
 score(a){

function drawSVG(src){
  let o='';
  src.split(';').map(s=>s.trim()).filter(Boolean).forEach(cmd=>{
    const [k,...r]=cmd.split(/\s+/);const n=r.map(Number);
    const pts=()=>{const p=[];for(let i=0;i<n.length;i+=2)p.push(n[i]+','+n[i+1]);return p.join(' ');};
    if(k==='f') o+='<line x1="4" y1="74" x2="116" y2="74" class="g-t"/>';
    else if(k==='h') o+=`<circle cx="${n[0]}" cy="${n[1]}" r="5" class="g-h"/>`;
    else if(k==='l') o+=`<polyline points="${pts()}" class="g-b"/>`;
    else if(k==='t') o+=`<polyline points="${pts()}" class="g-t"/>`;
    else if(k==='r') o+=`<rect x="${n[0]}" y="${n[1]}" width="${n[2]}" height="${n[3]}" rx="1.5" class="g-r"/>`;
    else if(k==='o') o+=`<circle cx="${n[0]}" cy="${n[1]}" r="${n[2]}" class="g-o"/>`;
    else if(k==='a') o+=`<line x1="${n[0]}" y1="${n[1]}" x2="${n[2]}" y2="${n[3]}" class="g-a"/>`;
    else if(k==='c') o+=`<path d="M${n[0]} ${n[1]} Q${n[2]} ${n[3]} ${n[4]} ${n[5]}" class="g-a"/>`;
    else if(k==='e') o+=`<ellipse cx="${n[0]}" cy="${n[1]}" rx="${n[2]}" ry="${n[3]}" class="g-e"/>`;
  });
  return `<svg viewBox="0 0 120 80" class="exfig" aria-hidden="true">${o}</svg>`;
}

 eccWE:{n:'손목폄근 천천히 내리기(편심성)',t:'손목폄근 힘줄 회복',g:TABLE_ARM+'l 20 47 76 47 88 54; o 91 57 4; c 98 38 106 50 98 64',how:'아래팔을 탁자에 올리고 손바닥을 아래로 해 아령을 잡습니다. 성한 손으로 아픈 손목을 위로 들어 올려 준 뒤, 아픈 손목만으로 3~4초에 걸쳐 천천히 내립니다.',d:{m:'0.5~1 kg, 15회 × 3세트, 하루 1번',l:'매주 무게를 조금씩 늘려 15회 × 3세트, 하루 1번'},c:'운동 중 약한 통증(10점 중 3점 이하)은 괜찮지만, 다음 날 통증이 늘면 무게를 줄이십시오.'},
 stretchWE:{n:'손목폄근 스트레칭',t:'아래팔 뒤쪽 근육 유연성',g:'f; h 20 14; l 20 19 20 50; l 20 50 14 74; l 20 50 26 74; l 20 26 74 26 80 40; l 20 30 60 34 82 36; c 90 24 94 36 86 46',how:'아픈 팔을 앞으로 쭉 펴고 손바닥을 아래로 합니다. 성한 손으로 아픈 손등을 몸 쪽으로 눌러 손목을 굽힙니다. 아래팔 바깥쪽이 당기는 느낌이 들면 유지합니다.',d:{h:'가볍게 20초 × 3회',m:'30초 × 3회, 하루 2~3번',l:'30초 × 3회, 운동 전후'}},
 proSup:{n:'망치 아래팔 돌리기',t:'아래팔 돌림(엎침·뒤침) 근력',g:TABLE_ARM+'l 20 47 80 47; t 84 28 84 50; r 78 22 12 6; c 66 32 84 14 102 32',how:'아래팔을 탁자에 올리고 망치(또는 물병)를 세워 잡습니다. 손바닥이 아래를 보도록, 위를 보도록 천천히 돌립니다. 손잡이를 짧게 잡을수록 쉽습니다.',d:{m:'짧게 잡고 15회 × 2세트',l:'15회 × 3세트, 점점 길게 잡기'}},
 grip:{n:'공 쥐기',t:'쥐는 힘 회복',g:'l 8 62 56 48; o 68 44 10; t 60 36 70 32 80 38 78 50; a 94 28 82 36; a 94 60 82 52',how:'부드러운 공이나 퍼티를 손 전체로 쥐고 3~5초 유지한 뒤 천천히 폅니다. 테니스엘보라면 팔꿈치를 굽힌 자세에서 먼저 하고, 좋아지면 팔꿈치를 편 자세로 합니다.',d:{h:'통증 없는 힘으로 5초 × 10회',m:'10~15회 × 2~3세트',l:'단단한 공으로 15회 × 3세트'}},
 wristAROM:{n:'손목 관절 운동',t:'손목 가동범위 회복',g:TABLE_ARM+'l 20 47 78 47 86 34; t 78 47 86 60; c 94 32 102 46 94 60',how:'아래팔을 탁자에 올리고 손목 젖히기, 굽히기, 엄지 쪽·새끼 쪽으로 기울이기, 손바닥 위·아래로 뒤집기를 차례로 천천히 합니다.',d:{h:'통증 없는 범위로 동작별 10회, 하루 3~5번',m:'동작별 10~15회, 끝에서 5초 유지, 하루 3번',l:'동작별 15회, 준비운동으로'}},
 prayer:{n:'기도 자세 스트레칭',t:'손목 굽힘·폄 유연성',g:STAND(60)+'l 60 22 44 36 59 28; l 60 22 76 36 61 28; a 86 30 86 46',how:'가슴 앞에서 양 손바닥을 맞대고 손바닥이 떨어지지 않게 하며 팔꿈치를 천천히 내립니다. 이어서 손등을 맞대고 손끝이 아래를 향하게 해 팔꿈치를 올립니다.',d:{m:'각 20~30초 × 3회',l:'각 30초 × 3회, 하루 2번'}},
 tendonGlide:{n:'힘줄 미끄러지기 운동',t:'손가락 힘줄 움직임, 붓기·뻣뻣함 감소',g:'l 14 66 14 20; l 48 66 48 34 56 26 50 32; l 84 66 84 40 94 36 94 48 86 48; a 24 42 38 42; a 62 42 74 42',how:'손가락 쭉 펴기 → 갈고리 주먹(손끝을 손가락 뿌리에 대기) → 완전 주먹 → 곧은 주먹(손끝을 손바닥 아래쪽에 대기) → 테이블 자세(손가락 뿌리 관절만 굽히기)를 차례로 합니다.',d:{h:'자세별 3~5초, 5회 반복, 하루 3~5번',m:'자세별 5초, 10회 반복, 하루 3번',l:'자세별 5초, 10회 반복, 하루 2번'}},
 nerveGlide:{n:'정중신경 미끄러지기 운동',t:'신경 움직임 개선, 저림 완화',g:STAND(40)+'l 40 22 78 22 82 10; l 40 22 30 38; c 58 8 72 2 84 4',how:'① 주먹 쥐고 손목 곧게 → ② 손가락 펴기 → ③ 손목 뒤로 젖히기 → ④ 엄지 바깥으로 벌리기 → ⑤ 손바닥이 위를 보게 뒤집기 → ⑥ 다른 손으로 엄지를 살짝 당기기. 각 자세를 3~5초 유지합니다.',d:{h:'①~④단계까지만 5회, 하루 2~3번',m:'전 단계 5~10회, 하루 3번',l:'전 단계 10회, 하루 3번'},c:'저림이 심해지면 그 직전 단계까지만 하고, 운동 후 30분 넘게 저림이 남으면 횟수를 줄이십시오.'},
 wristStrength:{n:'손목 근력 운동',t:'손목 굽힘근·폄근 근력',g:TABLE_ARM+'l 20 47 76 47 86 40; o 89 38 4; c 98 56 104 46 98 34',how:'아래팔을 탁자에 올리고 가벼운 아령이나 물병을 잡습니다. 손바닥이 위를 향하게 해 손목 굽히기, 아래를 향하게 해 손목 펴기를 하고, 내릴 때는 3초에 걸쳐 천천히 내립니다.',d:{m:'0.5 kg, 10~15회 × 2세트',l:'1~2 kg, 10~12회 × 3세트, 주 3회'}},
 wb:{n:'단계적 손 짚기',t:'손 짚기·밀기 능력 회복',g:'f; r 70 40 40 4; t 76 44 76 74; t 106 44 106 74; l 40 74 48 46; l 48 46 54 22; h 58 16; l 54 26 76 40; a 66 14 66 32',how:'① 서서 탁자를 손바닥으로 짚고 체중을 조금씩 싣기 → ② 벽 짚고 팔굽혀펴기 → ③ 무릎 꿇고 네발 자세로 체중 싣기 순서로 진행합니다. 통증이 없을 때 다음 단계로 넘어갑니다.',d:{m:'①단계, 10초 × 10회',l:'②~③단계, 10초 × 10회'},c:'손목 새끼손가락 쪽에서 딸깍 소리나 날카로운 통증이 나면 중단하십시오.'},
 thumbAbd:{n:'엄지 벌리기 근력 운동',t:'엄지 근육 근력',g:'l 10 58 70 58 98 58; l 60 56 68 40; t 62 50 82 54; a 78 46 72 32',how:'손바닥을 위로 해 탁자에 올리고 엄지와 손에 고무줄을 겁니다. 엄지를 천장 쪽으로 들어 고무줄을 늘린 뒤 3초 유지합니다.',d:{m:'10회 × 2세트',l:'15회 × 3세트'}},
 /* ---------- 목·등 ---------- */
 chinTuck:{n:'턱 당기기',t:'목 자세 교정',g:'f; r 10 4 5 70; h 30 14; l 28 19 26 46; l 26 46 22 74; l 26 46 32 74; a 46 14 36 14',how:'벽에 등을 대고 서서 시선은 정면을 유지한 채 뒤통수를 벽 쪽으로 밀며 턱을 뒤로 당깁니다. 앉아서 일할 때도 수시로 합니다.',d:{h:'5초 × 10회, 하루 수시로',m:'5초 × 10회, 하루 3번',l:'10초 × 10회, 하루 2번'}},
 dnf:{n:'누워서 머리 끄덕이기',t:'깊은 목굽힘근 강화',g:BED+'l 104 60 74 44 62 60 32 60; h 25 57; c 16 46 20 40 28 44',how:'바로 누워 무릎을 세우고 뒤통수를 바닥에 댄 채, ‘예’ 하듯 턱을 살짝 당겨 끄덕입니다. 목 앞쪽의 큰 근육이 튀어나오지 않을 정도로 약하게 합니다.',d:{h:'5초 × 5회, 하루 2~3번',m:'10초 × 10회, 하루 2번',l:'10초 × 10회 후, 머리를 바닥에서 살짝 들어 5초 × 5회'}},
 neckROM:{n:'목 돌리기·기울이기',t:'목 가동범위 유지',g:STAND(60)+'l 60 22 48 42; l 60 22 72 42; c 46 6 60 -2 74 6',how:'바른 자세로 앉아 천천히 고개를 오른쪽·왼쪽으로 돌리고, 귀를 어깨 쪽으로 기울이고, 턱을 당기며 숙입니다. 통증 없는 범위에서 합니다.',d:{h:'방향별 5회, 하루 3~5번',m:'방향별 10회, 끝에서 3초',l:'방향별 10회, 준비운동으로'}},
 upperTrapStretch:{n:'목 옆 스트레칭',t:'위등세모근 유연성',g:'f; h 54 14; l 60 20 60 50; l 60 50 54 74; l 60 50 66 74; l 60 24 72 18 56 8; l 60 24 64 48; a 48 10 40 18',how:'의자에 앉아 아픈 쪽 손으로 의자 아래를 잡고, 반대 손으로 머리를 반대쪽으로 천천히 기울여 목 옆이 당기게 합니다.',d:{h:'가볍게 15~20초 × 3회',m:'30초 × 3회, 하루 2~3번',l:'30초 × 3회, 하루 2번'}},
 catCamel:{n:'고양이·낙타 자세',t:'척추 유연성',g:'f; h 24 44; l 32 50 56 38 82 50; l 32 50 32 74; l 82 50 82 74 100 74; t 32 50 56 58 82 50; a 56 32 56 22',how:'네발 기기 자세에서 숨을 내쉬며 등을 천장 쪽으로 둥글게 말고, 들이쉬며 등을 천천히 펴서 살짝 내립니다. 통증 없는 범위에서 합니다.',d:{h:'5~10회, 하루 2~3번',m:'10회 × 2세트',l:'10회, 준비운동으로'}},
 openBook:{n:'옆으로 누워 몸통 돌리기',t:'등뼈 돌림 가동성',g:BED+'l 104 60 84 48 72 60 34 60; h 28 57; l 40 60 60 60; l 40 58 56 44; t 40 58 22 44; c 60 42 46 28 26 40',how:'옆으로 누워 무릎을 90° 굽히고 양팔을 앞으로 모읍니다. 위쪽 팔을 천장을 지나 뒤쪽 바닥으로 펴며 몸통과 시선을 함께 돌립니다. 무릎은 붙인 채 유지합니다.',d:{h:'통증 없는 범위로 5회',m:'양쪽 10회, 끝에서 3초',l:'양쪽 10회 × 2세트'}},
 foamExt:{n:'의자에서 등 펴기',t:'등뼈 폄 가동성',g:'f; r 40 46 30 4; t 44 50 44 74; t 66 50 66 74; t 40 46 40 28; l 56 46 82 46 82 74; l 56 46 44 22; h 40 16; l 44 24 34 12 38 8; c 60 20 52 6 38 2',how:'등받이가 낮은 의자에 앉아 손깍지를 머리 뒤에 끼고, 등받이 위 모서리를 받침점 삼아 가슴을 천장 쪽으로 열며 뒤로 젖힙니다. 허리가 아니라 등(가슴 부위)에서 움직입니다.',d:{h:'가볍게 5회',m:'10회, 끝에서 3초',l:'10회 × 2세트, 말아 둔 수건을 등 아래에 놓고 누워서도'}},
 /* ---------- 허리·골반 ---------- */
 pelvicTilt:{n:'골반 기울이기',t:'허리·배 근육 조절',g:BED+'l 32 60 62 60 76 44 90 60; h 25 57; a 52 50 52 59',how:'바로 누워 무릎을 세우고, 배에 살짝 힘을 주며 허리를 바닥 쪽으로 납작하게 눌렀다가 풉니다.',d:{h:'5초 × 10회, 하루 2~3번',m:'10초 × 10회',l:'준비운동으로 10회'}},
 kneeToChest:{n:'무릎 가슴으로 당기기',t:'허리 굽힘 유연성',g:BED+'l 36 60 62 60 56 40 72 46; h 29 57; l 42 58 58 42; c 76 52 72 36 60 36',how:'바로 누워 한쪽(또는 양쪽) 무릎을 양손으로 잡고 가슴 쪽으로 천천히 당깁니다.',d:{h:'한쪽씩 20초 × 3회',m:'30초 × 3회',l:'30초 × 3회, 하루 1~2번'},c:'다리로 뻗치는 통증이나 저림이 심해지면 중단하십시오.'},
 pressUp:{n:'엎드려 상체 들기',t:'허리 폄(맥켄지 운동)',g:BED+'l 104 60 62 60 38 42; h 32 36; l 42 46 44 60; a 26 56 30 42',how:'엎드려 손바닥을 어깨 옆에 두고, 골반은 바닥에 붙인 채 팔을 펴서 상체를 들어 올립니다. 허리 힘은 빼고 축 늘어뜨립니다.',d:{h:'팔꿈치로 받친 자세 1~2분부터, 하루 3~5번',m:'10회, 끝에서 2초, 하루 3~4번',l:'10회, 하루 2번'},c:'다리 통증이 발 쪽으로 더 내려가면 중단하십시오. 통증이 허리 가운데로 모이면 좋은 신호입니다.'},
 bridge:{n:'엉덩이 들기(브리지)',t:'엉덩이·몸통 근력',g:BED+'h 18 57; l 24 60 40 58 66 44 80 60; a 58 62 58 46',how:'바로 누워 무릎을 세우고 배에 살짝 힘을 준 뒤, 엉덩이를 들어 어깨-엉덩이-무릎이 일직선이 되게 합니다.',d:{h:'낮게 들어 3초 × 8회',m:'5초 × 10회 × 2세트',l:'10회 × 3세트, 한 다리 브리지로 진행'}},
 birdDog:{n:'네발 자세 팔다리 들기',t:'몸통 안정성',g:'f; h 26 42; l 34 50 82 50; l 40 50 40 74; l 34 50 10 44; l 82 50 106 46; l 82 50 76 74 92 74',how:'네발 기기 자세에서 배에 힘을 주고 반대쪽 팔과 다리를 천천히 뻗어 몸통과 일직선이 되게 합니다. 허리가 처지거나 골반이 돌아가지 않게 합니다.',d:{h:'팔만 또는 다리만 들기, 5초 × 5회',m:'팔·다리 함께 5초 × 8~10회',l:'10초 × 10회 × 2세트'}},
 sideBridge:{n:'옆으로 버티기',t:'옆구리·몸통 근지구력',g:'f; l 18 74 30 74 30 60 104 74; h 26 52; a 66 76 66 58',how:'옆으로 누워 팔꿈치를 어깨 아래에 두고, 무릎(익숙해지면 발)을 지지점으로 엉덩이를 들어 몸이 일직선이 되게 버팁니다.',d:{m:'무릎 대고 10초 × 5회, 양쪽',l:'발 대고 10~20초 × 5회, 양쪽'}},

function rxData(inst){
  const r=RX[inst.id](inst,state.answers[inst.id]);
  const seen=new Set(), list=[];
  r.ids.forEach(id=>{if(seen.has(id))return;seen.add(id);const e=EX[id];if(e&&e.d[r.st])list.push({id,e,dose:e.d[r.st]});});
  return {st:r.st, lab:r.lab||STAGE[r.st], list:list.slice(0,r.max||7), extra:r.extra||[], note:r.note||[], stop:r.stop||[]};
}
function exCard(x,i,big){
  return `<div class="ex${big?' ex-big':''}">${drawSVG(x.e.g)}<div class="ex-body"><div class="ex-h"><span class="ex-n">${i+1}</span><b>${esc(x.e.n)}</b></div><div class="ex-t">목적: ${esc(x.e.t)}</div><p>${esc(x.e.how)}</p><div class="ex-d">${esc(x.dose)}</div>${x.e.c?`<div class="ex-c">⚠ ${esc(x.e.c)}</div>`:''}</div></div>`;
}
function rxHTML(inst){
  const r=rxData(inst);
  let h=`<div class="rx"><h3>운동지침</h3><div class="stage st-${r.st}"><b>${esc(r.lab[0])}</b> — ${esc(r.lab[1])}</div><ul>${[...r.lab[2],...r.extra,...COMMON_GUIDE].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(r.note.length) h+=`<div class="note">${r.note.map(esc).join(' ')}</div>`;
  h+=`<h3 style="margin-top:14px">운동 방법</h3><div class="ex-grid">${r.list.map((x,i)=>exCard(x,i)).join('')}</div>`;
  h+=`<div class="toolbar" style="margin:12px 0 4px"><button class="btn primary" data-hand="${inst.id}">환자용 운동 안내문 보기</button></div>`;
  return h+`<div class="note">운동 처방은 설문 결과에 따른 일반적인 예시입니다. 신체 검사 결과에 맞춰 조정하십시오.</div></div>`;
}
function rxSummaryLine(inst){const R=rxData(inst);return `  운동(${R.lab[0]}): ${R.list.map(x=>x.e.n).join(', ')}\n`;}

/* ---------- 환자용 안내문 ---------- */
function handoutData(ids){
  const insts=INST.filter(i=>ids.includes(i.id)&&isComplete(i));
  const seen=new Set(), list=[], extra=[], stop=[...STOP_COMMON], from=[];
  let st='l', lab=null;
  insts.forEach(inst=>{
    const r=rxData(inst); from.push(inst.short);
    if(!lab||RANK[r.st]>RANK[st]){st=r.st;lab=r.lab;}
    r.list.forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);list.push(x);}});
    r.extra.forEach(x=>{if(!extra.includes(x))extra.push(x);});
    r.stop.forEach(x=>{if(!stop.includes(x))stop.push(x);});
  });
  return {insts,from,st,lab:lab||STAGE.l,list:list.slice(0,10),extra,stop};
}
function handoutHTML(H){
  const p=state.pt;
  let h=`<div class="ho-title">나의 운동 안내문</div><div class="ho-meta">${esc(p.name||'이름: __________')} · ${esc(p.date||'')} · 근거 설문: ${esc(H.from.join(', '))}</div>`;
  h+=`<section><h2>운동 원칙 — ${esc(H.lab[1])}</h2><ul>${[...H.lab[2],...H.extra,...COMMON_GUIDE].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`;
  h+=`<section><h2>나의 운동 (${H.list.length}가지)</h2><div class="ho-list">${H.list.map((x,i)=>exCard(x,i,true)).join('')}</div></section>`;
  h+=`<section class="ho-stop"><h2>이럴 때는 운동을 멈추고 연락하세요</h2><ul>${H.stop.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`;
  h+=`<section><h2>1주 운동 기록표 (한 날에 ✓ 표시)</h2><table class="ho-log"><thead><tr><th>운동</th>${['월','화','수','목','금','토','일'].map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${H.list.map(x=>`<tr><td>${esc(x.e.n)}</td>${'<td></td>'.repeat(7)}</tr>`).join('')}</tbody></table></section>`;
  h+=`<div class="ho-sign">담당 물리치료사: ______________ · 다음 방문일: ______________</div>`;
  return h;
}
function handoutText(H){
  const p=state.pt;
  let t=`[나의 운동 안내문]\n${p.name||''} ${p.date||''}\n\n■ 운동 원칙 — ${H.lab[1]}\n`+[...H.lab[2],...H.extra,...COMMON_GUIDE].map(x=>'- '+x).join('\n');
  t+='\n\n■ 나의 운동\n'+H.list.map((x,i)=>`${i+1}. ${x.e.n} (${x.dose})\n   ${x.e.how}${x.e.c?`\n   ※ ${x.e.c}`:''}`).join('\n');
  t+='\n\n■ 이럴 때는 운동을 멈추고 연락하세요\n'+H.stop.map(x=>'- '+x).join('\n');
  return t;
}
let HO_CUR=null;
function openHandout(which){
  const ids=which==='all'?INST.map(i=>i.id):[which];
  const H=handoutData(ids);
  if(!H.list.length){toast('모든 문항에 응답한 설문이 있어야 안내문을 만들 수 있습니다');return;}
  HO_CUR=H;
  document.getElementById('ho-body').innerHTML=handoutHTML(H);
  document.getElementById('ho').classList.add('show');
  document.getElementById('ho-body').scrollTop=0;
}

function clinOn(id){return !!(state.clin&&state.clin[id]);}

}

/* ============ 검사 소견 + 설문 결과 통합(공통) ============ */
function instInfo(i){const s=i.score(state.answers[i.id]);const sh=i.short||i.id.toUpperCase();let st=null;try{if(typeof RX!=='undefined'&&RX[i.id]){st=rxData(i).st;}}catch(e){}

// rows0: [{reg, dx:[[이름,소견수,tone,우선중재]], ids:[설문], qOnly, fOnly, qRefer}]
function integrate(rows0,opt){

    } else if(fOnly||!(ids||[]).length){

    } else if(dx.length){

    } else {
      if(sev||mod){verdict='설문상 장애 있음 — 검사 소견 없음';tone='warn';note.push(`설문상 ${sc.map(x=>x.interp).join('·')} 수준입니다. 검사 소견을 체크해 원인을 확인하십시오.`);pend.push(reg);}

}

function renderGuide(){
  $('#main').innerHTML=`<div class="panel-head"><h1>운동 안내문</h1><div class="full">산전·산후 환자 운동 안내문 — 산전 운동(임신 중)·산후 운동(출산 후), 시작자세·종료자세 포함</div>
  <p class="desc">환자에게 보여 주거나 인쇄해 나눠 줄 수 있는 산전·산후 운동 안내문입니다. 그림을 누르면 크게 볼 수 있습니다.</p></div>
  <div class="guide-wrap"><img src="${GUIDE_IMG}" alt="산전·산후 환자 운동 안내문" id="guide-img"></div>
  <div class="toolbar"><button class="btn primary" data-act="guide-print">🖨 인쇄용 파일 받기(A4 가로)</button><button class="btn" data-act="guide-zoom">🔍 크게 보기</button></div>
  <div class="note">설문 결과에 맞춘 개인별 운동 처방은 각 설문의 결과 창이나 ‘결과 요약 → 전체 운동 안내문’에서 볼 수 있습니다.</div>`;
}
async function printGuide(){
  const p=state.pt;
  const body=`<div class="pf-head"><div><h1>운동 안내문</h1><div class="sm">산전 운동(임신 중) · 산후 운동(출산 후)</div></div><div class="sm">이름: ${esc(p.name||'__________')} · ${esc(p.date||'')}</div></div><img src="${GUIDE_IMG}" style="max-width:100%;max-height:172mm;display:block;margin:0 auto">`;
  let html=printDoc('산전·산후 운동 안내문',body).replace('</style></head>','@page{size:A4 landscape;margin:8mm}</style></head>');
  const who=(p.name||'').replace(/[\\/:*?"<>|\s]+/g,'');
  const fname=`산전산후_운동안내문(그림)${who?'_'+who:''}_${today()}.html`;
  window.__lastPrint={fname,html};
  if(!DL){openPrintWindow(html,fname);return;}
  try{await DL.save({filename:fname,data:html});toast('인쇄용 파일을 받았습니다. 파일을 열면 인쇄 창이 뜹니다');}
  catch(e){const c=e&&e.code;toast(c==='declined'?'파일 받기를 취소했습니다':'파일을 만들지 못했습니다('+(c||'오류')+')');}
}

  const zoom=()=>{z.innerHTML=`<img src="${GUIDE_IMG}" alt="">`;z.classList.add('show');};
  if(e.target.id==='guide-img'){zoom();return;}
  const b=e.target.closest('[data-act="guide-zoom"],[data-act="guide-print"]');if(!b)return;
  b.dataset.act==='guide-zoom'?zoom():printGuide();});})();


/* ============ 인쇄 창 열기(일반 웹 배포용) ============ */
function openPrintWindow(html,fname){
  const w=window.open('','_blank');
  if(w){w.document.open();w.document.write(html);w.document.close();toast('새 창에서 인쇄 창이 열립니다');const pd=document.getElementById('pd');if(pd)pd.classList.remove('show');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fname;document.body.appendChild(a);a.click();a.remove();
  toast('팝업이 막혀 인쇄용 파일을 내려받았습니다. 파일을 열어 인쇄하십시오');
}
function explainHTML(inst){
  const ex=EXPLAIN[inst.id](inst,state.answers[inst.id]);
  let h=`<div class="explain"><h3>결과 해석</h3><p class="lead">${esc(ex.lead)}</p>`;
  ex.sec.forEach(([t,c])=>{
    h+=`<h4>${esc(t)}</h4>`;
    if(Array.isArray(c)) h+=`<ul>${c.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    else h+=c.chips.length?`<div class="chips">${c.chips.map(([x,k])=>`<span class="chip ${k}">${esc(x)}</span>`).join('')}</div>`:`<p>${esc(c.empty)}</p>`;
  });
  return h+`</div>`+rxHTML(inst);
}

/* ============ 상태 ============ */
const KEY='perinatal-q-v1';
let state={answers:{},pt:{},view:'pgq'};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.answers)state={...state,...s};}catch(e){}
INST.forEach(i=>{if(!state.answers[i.id])state.answers[i.id]={};});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

/* ============ 렌더링 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function progress(inst){
  const a=state.answers[inst.id];
  const req=inst.items.filter(i=>!i.optional);
  const n=req.filter(i=>{const v=a[i.id];return v!==undefined&&v!==null&&!(Array.isArray(v)&&!v.length);}).length;
  return [n,req.length];
}
function renderNav(){
  let h='';
  INST.forEach(inst=>{
    const [n,t]=progress(inst);
    h+=`<button class="nav-btn ${state.view===inst.id?'active':''}" data-view="${inst.id}"><div><b>${inst.short}</b><span class="sub">${inst.name}</span></div><span class="badge ${n===t?'done':''}">${n}/${t}</span></button>`;
  });
  h+=`<div class="nav-sep"></div><button class="nav-btn ${state.view==='guide'?'active':''}" data-view="guide"><div><b>🏃 운동 안내문</b><span class="sub">산전·산후 운동 그림 · 인쇄</span></div></button><button class="nav-btn ${state.view==='algo'?'active':''}" data-view="algo"><div><b>🧭 임상의사결정</b><span class="sub">위험신호 · 분류 · 치료 방향</span></div></button><button class="nav-btn ${state.view==='summary'?'active':''}" data-view="summary"><div><b>결과 요약</b><span class="sub">전체 점수 · 복사</span></div></button><button class="nav-btn ${state.view==='cloud'?'active':''}" data-view="cloud"><div><b>☁️ 저장된 사례</b><span class="sub">로그인 · 저장 · 불러오기</span></div></button><button class="nav-btn" data-print-open="blank"><div><b>🖨 인쇄</b><span class="sub">빈 설문지 · 안내문 · 보고서</span></div></button>`;
  $('#nav').innerHTML=h;
  const act=$('#nav .active');
  if(act&&window.innerWidth<=860){try{let sc=act.parentElement;while(sc&&sc!==document.body&&!(sc.scrollWidth>sc.clientWidth+2))sc=sc.parentElement;if(sc&&sc!==document.body){const ar=act.getBoundingClientRect(),sr=sc.getBoundingClientRect();sc.scrollLeft+=(ar.left+ar.width/2)-(sr.left+sr.width/2);}}catch(e){}}
}
function resultHTML(inst){
  const r=inst.score(state.answers[inst.id]);
  let h=`<div class="result lv-${r.lv}"><div class="r-top"><div><div class="lbl">${inst.short} 점수 ${esc(r.unit)}</div><div class="big">${esc(r.main)}</div></div><span class="interp">${esc(r.interp)}</span>${r.done?'':'<span class="lbl">응답 진행 중 — 현재까지의 응답으로 계산</span>'}</div>`;
  h+=`<div class="lines">${r.lines.map(([k,v])=>`<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div>`;
  if(r.bars) h+=`<div class="bars">${r.bars.map(([l,v])=>`<span>${esc(l)}</span><div class="bar"><i style="width:${Number.isFinite(v)?v:0}%"></i></div><b>${fmt(v,0)}</b>`).join('')}</div>`;
  (r.alerts||[]).forEach(x=>h+=`<div class="alert">⚠ ${esc(x)}</div>`);
  h+=`<div class="note">${esc(r.note)}</div>`;
  if(isComplete(inst)) h+=explainHTML(inst);
  else h+=`<div class="note" style="margin-top:10px">▸ 모든 문항에 응답하면 결과 해석이 나타납니다.</div>`;
  return h+`</div>`;
}
function isComplete(inst){const [n,t]=progress(inst);return n===t;}
function showResult(inst){
  $('#rm-title').textContent=`${inst.short} 결과 — ${inst.name}`;
  $('#rm-body').innerHTML=resultHTML(inst);
  const k=INST.findIndex(x=>x.id===inst.id);
  $('#rm-next').textContent=k<INST.length-1?`다음 도구로 (${INST[k+1].short}) ›`:'결과 요약 보기 ›';
  $('#rmodal').classList.add('show');
}
const closeR=()=>$('#rmodal').classList.remove('show');
$('#rm-x').onclick=closeR;$('#rm-close').onclick=closeR;
$('#rmodal').addEventListener('click',e=>{if(e.target.id==='rmodal')closeR();});
$('#rm-next').onclick=()=>{closeR();const k=INST.findIndex(x=>x.id===state.view);state.view=k<INST.length-1?INST[k+1].id:'summary';save();render();window.scrollTo({top:0});};
function itemHTML(inst,it,idx){
  const a=state.answers[inst.id][it.id];
  const answered=a!==undefined&&!(Array.isArray(a)&&!a.length);
  let h=it.sec?`<div class="sec">${esc(it.sec)}</div>`:'';
  h+=`<div class="item ${answered?'answered':''}" id="it-${inst.id}-${it.id}"><div class="q"><span class="n">${idx+1}.</span><span>${esc(it.q)}</span></div>`;
  if(it.type==='scale11'){
    h+=`<div class="opts scale">`+Array.from({length:11},(_,k)=>`<button class="opt ${a===k?'sel':''}" data-i="${inst.id}" data-q="${it.id}" data-v="${k}">${k}</button>`).join('')+`</div><div class="scale-ends"><span>${esc(it.ends[0])}</span><span>${esc(it.ends[1])}</span></div>`;
  }else if(it.type==='multi'){
    const arr=Array.isArray(a)?a:[];
    h+=`<div class="opts">`+it.o.map((o,k)=>`<button class="opt ${arr.includes(k)?'sel':''}" data-i="${inst.id}" data-q="${it.id}" data-m="${k}">${arr.includes(k)?'☑':'☐'} ${esc(o)}</button>`).join('')+`</div>`;
  }else{
    h+=`<div class="opts">`+it.o.map((o,k)=>`<button class="opt ${a===k?'sel':''}" data-i="${inst.id}" data-q="${it.id}" data-v="${k}">${esc(o)}</button>`).join('');
    if(it.na) h+=`<button class="opt na ${a==='na'?'sel':''}" data-i="${inst.id}" data-q="${it.id}" data-v="na">해당 없음</button>`;
    h+=`</div>`;
  }
  return h+`</div>`;
}
function renderInst(inst){
  let h=`<div class="panel-head"><h1>${inst.short} · ${esc(inst.name)}</h1><div class="full">${esc(inst.full)}</div><p class="desc">${esc(inst.desc)}</p><div class="instr">${esc(inst.instr)}</div></div>`;
  h+=`<div id="res">${resultHTML(inst)}</div>`;
  h+=inst.items.map((it,i)=>itemHTML(inst,it,i)).join('');
  h+=`<div class="toolbar"><button class="btn primary" data-act="show">결과 보기</button><button class="btn" data-act="next">다음 도구로 ›</button><button class="btn" data-act="jump">미응답 문항으로 이동</button><button class="btn" data-print="blank:${inst.id}">🖨 빈 설문지 인쇄</button><button class="btn danger" data-act="reset-one">이 도구 응답 지우기</button></div><div class="ref">출처: ${esc(inst.ref)}</div>`;
  $('#main').innerHTML=h;
}
function ptLine(){
  const p=state.pt;
  return `${p.name||'(이름 미입력)'} | 평가일 ${p.date||'-'} | ${p.phase||'시기 미입력'} ${p.week||''}`.trim();
}
function summaryText(){
  let t=`[산전·산후 설문 결과]\n${ptLine()}\n`;
  INST.forEach(inst=>{const [n,tt]=progress(inst);if(!n)return;const r=inst.score(state.answers[inst.id]);t+=`- ${r.text}${r.done?'':` (응답 ${n}/${tt})`}\n`;if(n===tt){const L=EXPLAIN[inst.id](inst,state.answers[inst.id]).lead;t+=`  → ${L.includes(' — ')?L.split(' — ').slice(1).join(' — '):L}\n`;t+=rxSummaryLine(inst);}});
  t+=algoSummaryText();
  return t;
}
function renderSummary(){
  let rows='';
  INST.forEach(inst=>{
    const [n,t]=progress(inst);const r=inst.score(state.answers[inst.id]);
    rows+=`<tr><td><b>${inst.short}</b><br><span style="color:var(--muted);font-size:12.5px">${esc(inst.name)}</span></td><td class="sc">${n?esc(r.main):'–'}<br><span style="color:var(--muted);font-size:12px;font-weight:400">${esc(r.unit)}</span></td><td><span class="pill ${n?r.lv:'none'}">${n?esc(r.interp):'미시행'}</span>${(r.alerts||[]).length?'<br><span style="color:var(--bad);font-size:12.5px;font-weight:700">⚠ 안전 평가 필요</span>':''}</td><td>${n}/${t}</td></tr>`;
  });
  $('#main').innerHTML=`<div class="panel-head"><h1>결과 요약</h1><div class="full">${esc(ptLine())}</div><p class="desc">각 도구의 점수와 해석을 한눈에 봅니다. 아래 텍스트를 복사해 차트(의무기록)나 보고서에 붙여 넣을 수 있습니다.</p></div>
  <table class="sum"><thead><tr><th>도구</th><th>점수</th><th>해석</th><th>응답</th></tr></thead><tbody>${rows}</tbody></table><div class="al-final t-${runAlgo().tone}" style="margin-top:12px"><h4>임상의사결정</h4><div class="al-dec">${esc(runAlgo().decision)}</div><button class="btn" data-view="algo" style="margin-top:4px">흐름도 보기 ›</button></div>
  <textarea class="copy" id="copytext" readonly>${esc(summaryText())}</textarea>
  <div class="toolbar"><button class="btn primary" data-act="copy">요약 텍스트 복사</button><button class="btn" data-hand="all">전체 운동 안내문</button><button class="btn" data-print-open="report">🖨 인쇄</button><button class="btn danger" data-act="reset-all">모든 응답·환자 정보 지우기</button></div>
  <div class="note">이 도구는 교육·임상 보조용입니다. 점수 해석은 임상 소견과 함께 판단하십시오. 응답은 이 브라우저에만 임시 저장되며 서버로 전송되지 않습니다.</div>`;
}
function render(){
  renderNav();
  const inst=INST.find(i=>i.id===state.view);
  inst?renderInst(inst):state.view==='algo'?renderAlgo():state.view==='guide'?renderGuide():state.view==='cloud'&&window.renderCloud?renderCloud():renderSummary();
}
/* 응답할 때 화면 위치 유지 + 다음 미응답 문항으로 부드럽게 이동 */
function keepPos(i,q,fn,adv){
  const id=`it-${i}-${q}`;const e0=document.getElementById(id);const y0=e0?e0.getBoundingClientRect().top:null;
  fn();
  const e1=document.getElementById(id);
  if(e1&&y0!=null){const d=e1.getBoundingClientRect().top-y0;if(Math.abs(d)>1)window.scrollBy(0,d);}
  if(!adv)return;
  const inst=INST.find(x=>x.id===i), a=state.answers[i];
  if(!inst||a[q]===undefined||isComplete(inst))return;
  const k=inst.items.findIndex(x=>x.id===q);
  const nx=inst.items.slice(k+1).find(x=>a[x.id]===undefined);
  const el=nx&&document.getElementById(`it-${i}-${nx.id}`);
  if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),180);
}
function refreshItem(instId,qid){
  const inst=INST.find(i=>i.id===instId);
  const idx=inst.items.findIndex(i=>i.id===qid);
  const el=document.getElementById(`it-${instId}-${qid}`);
  const tmp=document.createElement('div');tmp.innerHTML=itemHTML({...inst},{...inst.items[idx],sec:undefined},idx);
  el.replaceWith(tmp.firstElementChild);
  $('#res').innerHTML=resultHTML(inst);
  renderNav();
}

/* ============ 이벤트 ============ */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);}
function confirmBox(msg,yes){$('#modal-msg').textContent=msg;$('#modal').classList.add('show');$('#modal-yes').onclick=()=>{$('#modal').classList.remove('show');yes();};$('#modal-no').onclick=()=>$('#modal').classList.remove('show');}

document.addEventListener('click',e=>{
  const nb=e.target.closest('[data-view]');
  if(nb){state.view=nb.dataset.view;save();render();window.scrollTo({top:0});return;}
  const op=e.target.closest('.opt');
  if(op){
    const prevA=state.answers[op.dataset.i]&&state.answers[op.dataset.i][op.dataset.q];
    const {i,q}=op.dataset;const ans=state.answers[i];
    const instC=INST.find(x=>x.id===i);const wasDone=isComplete(instC);
    if(op.dataset.m!==undefined){
      const k=+op.dataset.m;let arr=Array.isArray(ans[q])?[...ans[q]]:[];
      arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k].sort((x,y)=>x-y);
      if(k===0&&arr.includes(0))arr=[0]; else arr=arr.filter(x=>x!==0||k===0);
      ans[q]=arr;
    }else{
      const v=op.dataset.v==='na'?'na':+op.dataset.v;
      if(ans[q]===v) delete ans[q]; else ans[q]=v;
    }
    keepPos(i,q,()=>{save();refreshItem(i,q);},prevA===undefined&&op.dataset.m===undefined);
    if(!wasDone&&isComplete(instC)){
      if(op.dataset.m===undefined) setTimeout(()=>showResult(instC),250);
      else toast('모두 응답했습니다. 해당 항목을 다 고른 뒤 ‘결과 보기’를 누르세요');
    }
    return;
  }
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const act=b.dataset.act;
  if(act==='show'){const inst=INST.find(x=>x.id===state.view);if(!isComplete(inst)){const [n,t]=progress(inst);toast(`아직 ${t-n}문항이 남았습니다`);}showResult(inst);return;}
  if(act==='next'){const k=INST.findIndex(x=>x.id===state.view);state.view=k<INST.length-1?INST[k+1].id:'summary';save();render();window.scrollTo({top:0});}
  if(act==='jump'){
    const inst=INST.find(x=>x.id===state.view);const a=state.answers[inst.id];
    const it=inst.items.find(x=>!x.optional&&(a[x.id]===undefined));
    if(!it){toast('모든 문항에 응답했습니다');return;}
    const el=document.getElementById(`it-${inst.id}-${it.id}`);el.scrollIntoView({behavior:'smooth',block:'center'});
    el.style.borderColor='var(--warn)';setTimeout(()=>el.style.borderColor='',1400);
  }
  if(act==='reset-one'){const inst=INST.find(x=>x.id===state.view);confirmBox(`${inst.short}의 응답을 모두 지울까요?`,()=>{state.answers[inst.id]={};save();render();});}
  if(act==='reset-all'){confirmBox('모든 도구의 응답과 환자 정보를 지울까요?',()=>{INST.forEach(i=>state.answers[i.id]={});state.pt={};state.clin={};save();fillPt();render();});}
  if(act==='copy'){
    const txt=summaryText();
    const fallback=()=>{const ta=$('#copytext');ta.focus();ta.select();toast('텍스트를 선택했습니다. Ctrl+C로 복사하세요');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('복사했습니다'),fallback);}catch(err){fallback();}
  }
});
['name','date','phase','week'].forEach(k=>{
  const el=$('#p-'+k);
  el.addEventListener('input',()=>{state.pt[k]=el.value;save();if(state.view==='summary')renderSummary();});
});
function fillPt(){
  if(!state.pt.date){const d=new Date();state.pt.date=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
  ['name','date','phase','week'].forEach(k=>$('#p-'+k).value=state.pt[k]||'');
}
fillPt();render();
</script>
